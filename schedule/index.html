<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ders Programı Oluşturucu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-scrollbar::-webkit-scrollbar {
            height: 12px;
            width: 12px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0E0D0B;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #24221F;
            border-radius: 6px;
            border: 2px solid #0E0D0B;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #C6A667;
        }

        @keyframes shimmer {
            0% {
                transform: translateX(-100%) skewX(12deg);
            }

            100% {
                transform: translateX(200%) skewX(12deg);
            }
        }

        .animate-shimmer {
            animation: shimmer 2s infinite;
        }
    </style>
</head>

<body
    class="bg-[#0E0D0B] text-[#F5E9CF] antialiased selection:bg-[#C6A667] selection:text-[#0E0D0B] min-h-screen flex flex-col items-center py-4 px-4">

    <!-- Control Bar -->
    <div
        class="w-full max-w-4xl mb-4 flex flex-col md:flex-row items-center justify-between gap-3 bg-[#1A1816]/90 backdrop-blur-md p-3 rounded-2xl shadow-2xl border border-[#24221F] relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-[#C6A667] via-[#F2D8A7] to-[#C6A667]"></div>

        <div class="flex items-center gap-3 z-10">
            <div class="bg-[#24221F] p-2 rounded-xl text-[#C6A667] ring-1 ring-[#C6A667]/20">
                <i data-lucide="crown" size="20" stroke-width="2" class="animate-pulse"></i>
            </div>
            <div>
                <h1 class="text-lg font-black text-[#F5E9CF] tracking-wide uppercase">Ders Programı</h1>
                <p class="text-[#F2D8A7] text-xs font-bold tracking-widest uppercase">Warm Dark Edition</p>
            </div>
        </div>

        <div class="flex items-center gap-2 w-full md:w-auto z-10">
            <button onclick="handleClearAll()"
                class="flex items-center justify-center gap-2 px-3 py-2 text-[#F2D8A7] hover:text-[#FFF] bg-transparent hover:bg-[#24221F] border border-[#C6A667]/40 hover:border-[#C6A667] rounded-xl transition-all font-bold text-xs w-full md:w-auto group tracking-widest uppercase">
                <i data-lucide="trash-2" size="14" class="group-hover:rotate-12 transition-transform"></i>
                Temizle
            </button>
            <button id="downloadBtn" onclick="handleDownload()"
                class="flex items-center justify-center gap-2 px-4 py-2 bg-[#C6A667] text-[#0E0D0B] hover:bg-[#D4B475] rounded-xl shadow-[0_0_20px_-5px_rgba(198,166,103,0.5)] transition-all font-black text-xs w-full md:w-auto disabled:opacity-70 disabled:cursor-not-allowed uppercase tracking-wide">
                <i data-lucide="download" size="16" stroke-width="3"></i>
                PNG İndir
            </button>
        </div>
    </div>

    <!-- Schedule Canvas Wrapper -->
    <div class="w-full overflow-x-auto pb-4 flex justify-center custom-scrollbar">
        <div id="printArea"
            class="bg-[#0E0D0B] p-4 rounded-2xl shadow-2xl w-[650px] mx-auto relative overflow-hidden border border-[#24221F]">

            <!-- Title Section -->
            <div class="mb-3 text-center space-y-1 relative z-10">
                <input type="text" id="titleInput" value="Haftalık Ders Programım"
                    class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-[#C6A667] via-[#F5E9CF] to-[#F2D8A7] text-center w-full bg-transparent focus:outline-none rounded-xl py-1 px-2 transition-all placeholder-[#24221F] tracking-tight uppercase"
                    placeholder="PROGRAM BAŞLIĞI">
                <div
                    class="flex items-center justify-center gap-2 text-[#F2D8A7] font-bold text-xs tracking-widest uppercase opacity-70">
                    <span class="w-6 h-[1px] bg-[#F2D8A7]/30"></span>
                    2024 - 2025
                    <span class="w-6 h-[1px] bg-[#F2D8A7]/30"></span>
                </div>
            </div>

            <!-- Grid Layout -->
            <div id="scheduleGrid" class="grid grid-cols-[70px_repeat(5,1fr)] gap-1 relative z-10">
                <!-- Header Row -->
                <div
                    class="bg-[#24221F] text-[#C6A667] rounded-lg flex items-center justify-center p-1.5 border border-[#24221F]/50">
                    <i data-lucide="clock" size="16" stroke-width="2"></i>
                </div>
                <!-- Days will be inserted here -->
            </div>

            <!-- Footer Info -->
            <div
                class="mt-3 flex justify-between items-center text-[#F5E9CF]/40 text-xs font-bold px-2 border-t border-[#24221F] pt-2">
                <div class="flex gap-3 font-mono uppercase text-xs">
                    <span class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full bg-[#C6A667]"></span>
                        40dk
                    </span>
                    <span class="flex items-center gap-1">
                        <span class="w-1.5 h-1.5 rounded-full border border-[#F2D8A7]"></span>
                        10/15dk
                    </span>
                </div>
                <div class="flex items-center gap-1 hover:text-[#C6A667] transition-colors cursor-pointer">
                    <i data-lucide="book-open" size="10"></i>
                    <span class="font-black tracking-widest uppercase text-xs">dersprogrami.app</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const DAYS = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma'];
        const TIME_SLOTS = [
            { period: 1, start: '08:10', end: '08:50' },
            { period: 2, start: '09:05', end: '09:45' },
            { period: 3, start: '09:55', end: '10:35' },
            { period: 4, start: '10:45', end: '11:25' },
            { period: 5, start: '11:35', end: '12:15' },
            { period: 6, start: '13:00', end: '13:40' },
            { period: 7, start: '13:50', end: '14:30' },
            { period: 8, start: '14:40', end: '15:20' },
        ];

        let schedule = {};

        function init() {
            renderGrid();
            if (window.lucide) lucide.createIcons();
            loadSchedule();
        }

        function renderGrid() {
            const grid = document.getElementById('scheduleGrid');
            if (!grid) return;

            // Render Days Headers
            DAYS.forEach(day => {
                const dayEl = document.createElement('div');
                dayEl.className = "bg-[#24221F] text-[#F2D8A7] border border-[#24221F]/50 rounded-lg flex items-center justify-center p-1.5 font-black text-xs uppercase tracking-wide";
                dayEl.textContent = day;
                grid.appendChild(dayEl);
            });

            // Render Time Slots and Inputs
            TIME_SLOTS.forEach((slot, index) => {
                if (index === 5) {
                    const lunchEl = document.createElement('div');
                    lunchEl.className = "col-span-6 bg-[#24221F]/50 border border-[#C6A667]/30 rounded-lg text-[#C6A667] py-2 flex items-center justify-center gap-2 my-1 relative overflow-hidden";
                    lunchEl.style.gridColumn = "span 6";
                    lunchEl.innerHTML = `
                        <span class="font-black italic text-xs flex items-center gap-1.5 z-10 uppercase">
                            <i data-lucide="coffee" size="14" stroke-width="2.5"></i>
                            Öğle Arası
                        </span>
                        <span class="text-[#F5E9CF] text-xs font-mono border border-[#C6A667]/50 px-2 py-0.5 rounded bg-[#C6A667]/10 font-bold">
                            12:25 - 13:00
                        </span>
                        <div class="absolute inset-0 bg-gradient-to-r from-transparent via-[#C6A667]/10 to-transparent skew-x-12 translate-x-[-100%] animate-shimmer"></div>
                    `;
                    grid.appendChild(lunchEl);
                }

                // Time Slot Cell
                const timeEl = document.createElement('div');
                timeEl.className = "bg-[#24221F] rounded-lg border border-[#24221F]/50 flex flex-col items-center justify-center p-1.5 relative select-none min-h-[75px]";
                timeEl.style.minHeight = "75px";
                timeEl.innerHTML = `
                    <div class="absolute top-0.5 left-0.5 bg-[#1A1816] text-[#C6A667] font-black px-1.5 py-0.5 rounded border border-[#C6A667]/20" style="font-size: 9px;">
                        ${slot.period}
                    </div>
                    <div class="flex flex-col items-center justify-center pt-1.5 w-full">
                        <div class="text-xl font-black text-[#C6A667] tracking-tighter leading-none">${slot.start}</div>
                        <div class="w-5 h-0.5 bg-[#C6A667]/30 rounded-full my-1"></div>
                        <div class="text-xs font-bold text-[#C6A667]/60">${slot.end}</div>
                    </div>
                `;
                grid.appendChild(timeEl);

                // Input Cells
                DAYS.forEach((_, dayIndex) => {
                    const key = `${dayIndex}-${slot.period}`;
                    const cell = document.createElement('div');
                    cell.id = `cell-${key}`;
                    cell.className = "flex items-center justify-center cursor-text rounded-lg border-2 transition-all relative overflow-hidden group min-h-[75px] bg-[#1A1816] border-transparent hover:bg-[#24221F] hover:border-[#F2D8A7]/30 focus-within:border-[#C6A667] focus-within:bg-[#24221F]";
                    cell.style.minHeight = "75px";

                    const input = document.createElement('div');
                    input.contentEditable = true;
                    input.className = "w-full h-full bg-transparent text-center focus:outline-none text-[#F5E9CF] font-black text-xl break-words";
                    input.style.display = "flex";
                    input.style.alignItems = "center";
                    input.style.justifyContent = "center";
                    input.style.textAlign = "center";
                    input.style.lineHeight = "1.1";
                    input.style.padding = "8px";
                    input.style.minHeight = "100%";

                    input.oninput = (e) => handleInputChange(dayIndex, slot.period, e.target.innerText);

                    cell.onclick = (e) => {
                        if (e.target !== input) input.focus();
                    };

                    cell.appendChild(input);
                    grid.appendChild(cell);
                });
            });
        }

        function handleInputChange(dayIndex, period, value) {
            const key = `${dayIndex}-${period}`;
            schedule[key] = value;
            updateCellVisuals(key, value);
            saveSchedule();
        }

        function updateCellVisuals(key, value) {
            const cell = document.getElementById(`cell-${key}`);
            if (!cell) return;

            if (value && value.trim() !== '') {
                cell.className = "flex items-center justify-center cursor-text rounded-lg border-2 transition-all relative overflow-hidden group min-h-[75px] bg-[#24221F] border-[#C6A667] shadow-[0_0_15px_rgba(198,166,103,0.2)]";
                if (!cell.querySelector('.accent-tr')) {
                    cell.insertAdjacentHTML('beforeend', `
                        <div class="accent-tr absolute top-0 right-0 w-6 h-6 bg-gradient-to-bl from-[#C6A667]/20 to-transparent pointer-events-none rounded-tr-lg"></div>
                        <div class="accent-bl absolute bottom-0 left-0 w-6 h-6 bg-gradient-to-tr from-[#F2D8A7]/20 to-transparent pointer-events-none rounded-bl-lg"></div>
                    `);
                }
            } else {
                cell.className = "flex items-center justify-center cursor-text rounded-lg border-2 transition-all relative overflow-hidden group min-h-[75px] bg-[#1A1816] border-transparent hover:bg-[#24221F] hover:border-[#F2D8A7]/30 focus-within:border-[#C6A667] focus-within:bg-[#24221F]";
                const accents = cell.querySelectorAll('.accent-tr, .accent-bl');
                accents.forEach(el => el.remove());
            }
        }

        function handleClearAll() {
            if (confirm('Tüm programı silmek istediğinize emin misiniz?')) {
                schedule = {};
                document.querySelectorAll('div[contenteditable]').forEach(input => {
                    input.innerText = '';
                    const parent = input.parentElement;
                    const key = parent.id.replace('cell-', '');
                    updateCellVisuals(key, '');
                });
                saveSchedule();
            }
        }

        async function handleDownload() {
            const printArea = document.getElementById('printArea');
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerHTML;

            btn.disabled = true;
            btn.innerHTML = `<div class="w-3 h-3 border-2 border-[#0E0D0B]/30 border-t-[#0E0D0B] rounded-full animate-spin"></div> Oluşturuluyor...`;

            await new Promise(resolve => setTimeout(resolve, 100));

            try {
                const canvas = await html2canvas(printArea, {
                    scale: 2,
                    backgroundColor: '#0E0D0B',
                    useCORS: true,
                    logging: false,
                });

                const image = canvas.toDataURL('image/png');
                const link = document.createElement('a');
                link.href = image;
                const title = document.getElementById('titleInput').value || 'Ders_Programi';
                link.download = `${title.replace(/\s+/g, '_')}_Ders_Programi.png`;
                link.click();
            } catch (error) {
                console.error("Export failed:", error);
                alert("Görüntü oluşturulurken bir hata oluştu.");
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
                if (window.lucide) lucide.createIcons();
            }
        }

        function saveSchedule() {
            localStorage.setItem('scheduleData', JSON.stringify(schedule));
            localStorage.setItem('scheduleTitle', document.getElementById('titleInput').value);
        }

        function loadSchedule() {
            const savedSchedule = localStorage.getItem('scheduleData');
            const savedTitle = localStorage.getItem('scheduleTitle');

            if (savedTitle) {
                document.getElementById('titleInput').value = savedTitle;
            }

            if (savedSchedule) {
                try {
                    schedule = JSON.parse(savedSchedule);
                    Object.entries(schedule).forEach(([key, value]) => {
                        const cell = document.getElementById(`cell-${key}`);
                        if (cell) {
                            const input = cell.querySelector('div[contenteditable]');
                            if (input) input.innerText = value;
                            updateCellVisuals(key, value);
                        }
                    });
                } catch (e) {
                    console.error("Error loading schedule:", e);
                }
            }
        }

        // Initialize
        init();

        // Title listener
        const titleInput = document.getElementById('titleInput');
        if (titleInput) {
            titleInput.addEventListener('input', saveSchedule);
        }

    </script>
</body>

</html>
