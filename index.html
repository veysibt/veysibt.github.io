<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>veysi yıldız</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        h1 {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 2rem;
            text-align: center;
            color: #fff;
        }

        /* Announcement Section */
        .announcement {
            background-color: #1e1e1e;
            border-left: 4px solid #3d5afe;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .announcement-label {
            display: inline-block;
            background-color: #3d5afe;
            color: white;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05rem;
        }

        .announcement-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: #fff;
        }

        .announcement-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #b0b0b0;
        }

        .announcement-date {
            font-size: 0.8rem;
            color: #6e6e6e;
            margin-top: 1rem;
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .btn {
            background-color: #1a1a1a;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            text-decoration: none;
        }

        .btn:hover {
            background-color: #2d2d2d;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        .icon {
            background-color: rgba(255, 255, 255, 0.1);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            color: #6e6e6e;
            font-size: 0.875rem;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .btn {
                padding: 0.875rem 1.25rem;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="announcement">
            <span class="announcement-label">Duyurular</span>
            <h2 class="announcement-title"></h2>
            <p class="announcement-content">
                duyuru yok.
            </p>
            <div class="announcement-date">nisan 4, 2025</div>
        </div>

        <h1>Hoş Geldiniz</h1>

        <div class="btn-container">
            <a href="notes.html" class="btn">
                <span>Sınıf Notları</span>
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" y1="13" x2="8" y2="13"></line>
                        <line x1="16" y1="17" x2="8" y2="17"></line>
                        <polyline points="10 9 9 9 8 9"></polyline>
                    </svg>
                </span>
            </a>

            <a href="schedule/index.html" class="btn">
                <span>Ders Programı Oluşturucu</span>
                <span class="icon">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="16" y1="2" x2="16" y2="6"></line>
                        <line x1="8" y1="2" x2="8" y2="6"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>
                    </svg>
                </span>
            </a>
        </div>

        <footer>
            © 2025 • All rights reserved
        </footer>
    </div>
</body>

</html>
