<!DOCTYPE html>

<html class="dark" lang="tr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Veysi Yıldız</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#4b2bee",
                        "background-light": "#f6f6f8",
                        "background-dark": "#0a0a0a",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>

<body class="font-display">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <div class="px-4 md:px-20 lg:px-40 flex flex-1 justify-center items-center py-10 md:py-20">
                <div class="layout-content-container flex flex-col max-w-[500px] w-full">
                    <!-- Page Heading -->
                    <div class="flex flex-wrap justify-between gap-3 p-4">
                        <div class="flex min-w-72 flex-col gap-3">
                            <h1
                                class="text-slate-900 dark:text-white text-4xl font-black leading-tight tracking-[-0.033em]">
                                Veysi Yıldız</h1>
                            <p class="text-slate-500 dark:text-[#a0a0a0] text-base font-normal leading-normal">Bilişim
                                Teknolojileri Öğretmeni</p>
                        </div>
                    </div>
                    <!-- Notes Section -->
                    <div class="w-full">
                        <h2
                            class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-8">
                            Notlar</h2>
                        <div class="flex flex-col">
                            <a class="flex items-center gap-4 bg-white/[0.03] hover:bg-white/[0.08] rounded-lg px-4 min-h-[72px] py-2 justify-between transition-colors duration-200"
                                href="notes.html">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="text-slate-700 dark:text-white flex items-center justify-center rounded-lg bg-slate-200 dark:bg-[#1a1a1a] shrink-0 size-12">
                                        <span class="material-symbols-outlined">article</span>
                                    </div>
                                    <div class="flex flex-col justify-center">
                                        <p
                                            class="text-slate-800 dark:text-white text-base font-medium leading-normal line-clamp-1">
                                            Ders Notları</p>
                                        <p
                                            class="text-slate-500 dark:text-[#888888] text-sm font-normal leading-normal line-clamp-2">
                                            Ders notları ve öğrenme materyalleri.</p>
                                    </div>
                                </div>
                                <div class="text-slate-400 dark:text-slate-600">
                                    <span class="material-symbols-outlined">arrow_forward</span>
                                </div>
                            </a>
                        </div>
                    </div>
                    <!-- Apps Section -->
                    <div class="w-full">
                        <h2
                            class="text-slate-900 dark:text-white text-[22px] font-bold leading-tight tracking-[-0.015em] px-4 pb-3 pt-8">
                            Uygulamalar</h2>
                        <div class="flex flex-col">
                            <a class="flex items-center gap-4 bg-white/[0.03] hover:bg-white/[0.08] rounded-lg px-4 min-h-[72px] py-2 justify-between transition-colors duration-200"
                                href="https://sema-ciz.vercel.app/" target="_blank">
                                <div class="flex items-center gap-4">
                                    <div
                                        class="text-slate-700 dark:text-white flex items-center justify-center rounded-lg bg-slate-200 dark:bg-[#1a1a1a] shrink-0 size-12">
                                        <span class="material-symbols-outlined">schema</span>
                                    </div>
                                    <div class="flex flex-col justify-center">
                                        <p
                                            class="text-slate-800 dark:text-white text-base font-medium leading-normal line-clamp-1">
                                            Akış Şeması Çiz</p>
                                        <p
                                            class="text-slate-500 dark:text-[#888888] text-sm font-normal leading-normal line-clamp-2">
                                            Akış şeması ve diyagram oluşturma aracı.</p>
                                    </div>
                                </div>
                                <div class="text-slate-400 dark:text-slate-600">
                                    <span class="material-symbols-outlined">arrow_forward</span>
                                </div>
                            </a>
                        </div>
                    </div>
                    <!-- Footer -->
                    <div class="px-4 pt-8">
                        <p class="text-slate-500 dark:text-[#666666] text-sm text-center">© 2025 • Tüm hakları saklıdır
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
