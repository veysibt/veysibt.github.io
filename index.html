<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>veysi yıldız</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0a0f0f 0%, #0f1f1a 50%, #0a1410 100%);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background orbs */
        body::before,
        body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.3;
            animation: float 8s ease-in-out infinite;
            pointer-events: none;
        }

        body::before {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #10b981, #14b8a6);
            top: -100px;
            right: -100px;
        }

        body::after {
            width: 300px;
            height: 300px;
            background: linear-gradient(135deg, #059669, #0d9488);
            bottom: -50px;
            left: -50px;
            animation-delay: -4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            50% {
                transform: translate(30px, -30px) scale(1.1);
            }
        }

        .container {
            max-width: 500px;
            width: 100%;
            position: relative;
            z-index: 1;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 2.5rem;
            text-align: center;
            background: linear-gradient(135deg, #fff 0%, #6ee7b7 50%, #34d399 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.02em;
        }

        .section {
            margin-bottom: 2rem;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 1.5rem;
            transition: all 0.3s ease;
        }

        .section:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.12);
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: #34d399;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.15rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .section-title::before {
            content: '';
            width: 8px;
            height: 8px;
            background: linear-gradient(135deg, #10b981, #14b8a6);
            border-radius: 2px;
            transform: rotate(45deg);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .btn {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(20, 184, 166, 0.05) 100%);
            color: #fff;
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 14px;
            padding: 1.25rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(20, 184, 166, 0.1) 100%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .btn:hover {
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 20px 40px -15px rgba(16, 185, 129, 0.3);
        }

        .btn:hover::before {
            opacity: 1;
        }

        .btn:active {
            transform: translateY(-2px);
        }

        .btn span:first-child {
            position: relative;
            z-index: 1;
        }

        .icon {
            background: linear-gradient(135deg, #10b981, #14b8a6);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s ease;
            position: relative;
            z-index: 1;
        }

        .btn:hover .icon {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 8px 20px -5px rgba(99, 102, 241, 0.5);
        }

        footer {
            text-align: center;
            margin-top: 2rem;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            font-weight: 500;
            letter-spacing: 0.05em;
        }

        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: #34d399;
            text-decoration: none;
            font-weight: 600;
            padding: 0.5rem 1rem;
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            background: rgba(16, 185, 129, 0.05);
            transition: all 0.3s ease;
            margin-bottom: 1rem;
        }

        .contact-link:hover {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.5);
            transform: translateY(-2px);
        }

        .copyright {
            color: rgba(255, 255, 255, 0.3);
        }

        /* Subtle animation on load */
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .container>* {
            animation: slideUp 0.6s ease-out backwards;
        }

        .container>h1 {
            animation-delay: 0.1s;
        }

        .container>.section:nth-of-type(1) {
            animation-delay: 0.2s;
        }

        .container>.section:nth-of-type(2) {
            animation-delay: 0.3s;
        }

        .container>footer {
            animation-delay: 0.4s;
        }

        @media (max-width: 480px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.75rem;
            }

            .section {
                padding: 1.25rem;
                border-radius: 16px;
            }

            .btn {
                padding: 1rem 1.25rem;
                border-radius: 12px;
            }

            .icon {
                width: 36px;
                height: 36px;
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Hoş Geldiniz</h1>

        <!-- Notlar Bölümü -->
        <div class="section">
            <h2 class="section-title">Notlar</h2>
            <div class="btn-container">
                <a href="notes.html" class="btn">
                    <span>Ders Notları</span>
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                            <polyline points="10 9 9 9 8 9"></polyline>
                        </svg>
                    </span>
                </a>
            </div>
        </div>

        <!-- Uygulamalar Bölümü -->
        <div class="section">
            <h2 class="section-title">Uygulamalar</h2>
            <div class="btn-container">
                <a href="https://sema-ciz.vercel.app/" class="btn" target="_blank" rel="noopener noreferrer">
                    <span>Akış Şeması Çiz</span>
                    <span class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="6" y1="3" x2="6" y2="15"></line>
                            <circle cx="18" cy="6" r="3"></circle>
                            <circle cx="6" cy="18" r="3"></circle>
                            <path d="M18 9a9 9 0 0 1-9 9"></path>
                        </svg>
                    </span>
                </a>
            </div>
        </div>

        <footer>
            <a href="contact.html" class="contact-link">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                    <polyline points="22,6 12,13 2,6"></polyline>
                </svg>
                İletişim
            </a>
            <div class="copyright">© 2025 • All rights reserved</div>
        </footer>
    </div>
</body>

</html>
